<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Navbar -->
     <header class="navbar">
        <a href="index.html" class="logo">Math Magician</a>

        <nav>

            <a href="index.html">Home</a>
            <a href="calculator.html">Calculator</a>
            <a href="quote.html" class="active">Quote</a>
            <button id="theme-toggle" class="theme-toggle">🌙</button>

        </nav>
     </header>
    
     <!-- Quote -->
    <main class="quote-page">
    <section class="quote-card">
    <p>Mathematic is not about numbers, equations, computationsor algorithm.
    it is about understanding . </p>

    <p>- william Paul thurston</p>

        </section>

      </main>

      <!-- Javascript -->
       <script>
        // Light and dark mode Codes 
document.addEventListener('DOMContentLoaded', () => {

  const toggleBtn = document.getElementById('theme-toggle');
  const body = document.body;

  // Load saved theme on page load
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    body.classList.add('light-mode');
    toggleBtn.textContent = '☀️';
  }

  // Toggle on click
  toggleBtn.addEventListener('click', () => {
    body.classList.toggle('light-mode');

    if (body.classList.contains('light-mode')) {
      toggleBtn.textContent = '☀️';
      localStorage.setItem('theme', 'light');
    } else {
      toggleBtn.textContent = '🌙';
      localStorage.setItem('theme', 'dark');
    }
  });

});
       </script>

</body>
</html>
