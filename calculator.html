<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->
<header class="navbar">
    <a href="index.html" class="logo">Math Magician</a>
    <nav>

        <a href="index.html">Home</a>
        <a href="calculator.html" class="active">Calculator</a>
        <a href="quote.html">Quote</a>

        <button id="theme-toggle" class="theme-toggle">🌙</button>

    </nav>

</header>

<!-- Calculator Section-->

<section class="calculator-page">

  <!-- Title -->
  <div class="calculator-title">
    <h1>Lets Do Some Math... </h1>
  </div>


  <!-- Calculator -->
  <section class="calculator">

    <!-- Display -->
    <div class="display" id="display">0</div>


    <!-- Buttons -->
    <div class="buttons">

      <!-- First Row -->
     <button id="delet" class="special">⌫</button>
<button id="del-All" class="special">AC</button>
<button id="percentage" class="special" data-value="%">%</button>
<button class="operator" data-value="/">÷</button>

<button class="number" data-value="7">7</button>
<button class="number" data-value="8">8</button>
<button class="number" data-value="9">9</button>
<button class="operator" data-value="*">×</button>

<button class="number" data-value="4">4</button>
<button class="number" data-value="5">5</button>
<button class="number" data-value="6">6</button>
<button class="operator" data-value="-">−</button>

<button class="number" data-value="1">1</button>
<button class="number" data-value="2">2</button>
<button class="number" data-value="3">3</button>
<button class="operator" data-value="+">+</button>

<button class="zero number" data-value="0">0</button>
<button class="point" data-value=".">.</button>
<button class="equal">=</button>

    </div>

  </section>

</section>


<!-- Javascript -->
 <script src="JS/script.js"></script>
    
</body>
</html>
